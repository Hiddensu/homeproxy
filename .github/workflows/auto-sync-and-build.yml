name: Sync Upstream & Build Package

on:
  schedule:
    # 每天凌晨 3:00 (UTC) 自动检查上游更新
    - cron: '0 3 * * *'
  # 支持在 Actions 页面手动点击按钮立即运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with Upstream
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/immortalwrt/homeproxy.git
          git fetch upstream

          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          LOCAL_HASH=$(git rev-parse HEAD)
          UPSTREAM_HASH=$(git rev-parse upstream/$BRANCH)

          echo "Local commit: $LOCAL_HASH"
          echo "Upstream commit: $UPSTREAM_HASH"

          if [ "$LOCAL_HASH" != "$UPSTREAM_HASH" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "检测到需要同步或手动触发，合并最新代码..."
            git merge upstream/$BRANCH -m "Auto sync from upstream"
            git push origin $BRANCH
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "代码已是最新，跳过本次构建。"
          fi

      - name: Setup OpenWrt SDK & Compile
        if: steps.sync.outputs.has_updates == 'true'
        id: compile
        run: |
          mkdir -p $HOME/build && cd $HOME/build

          echo "正在动态检索最新 OpenWrt SDK 下载地址..."
          BASE_URL="https://downloads.openwrt.org/snapshots/targets/x86/64/"
          SDK_FILE=$(curl -sL "$BASE_URL" | grep -oE 'openwrt-sdk-x86-64_[^"]+\.tar\.zst' | head -n 1)

          if [ -z "$SDK_FILE" ]; then
            echo "错误：未能获取到有效的 SDK 文件链接！"
            exit 1
          fi

          echo "下载 SDK: ${BASE_URL}${SDK_FILE}"
          curl -fLO "${BASE_URL}${SDK_FILE}"

          echo "解压 SDK..."
          zstd -d "$SDK_FILE"
          tar -xf *.tar --strip-components=1

          # 挂载源码到 SDK 目录
          cp -r ${{ github.workspace }} package/homeproxy

          # 安装并更新 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 强制开启 LuCI 简体中文语言支持及 HomeProxy 语言包
          make defconfig
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-homeproxy=m" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn=m" >> .config
          make defconfig

          # 执行独立包编译（同时编译主包和可能存在的独立语言包目标）
          echo "开始编译 HomeProxy 及中文语言包..."
          make package/homeproxy/compile -j$(nproc) V=s || true

          # 提取编译产物（同时匹配主包与语言包，兼容 .ipk 和 .apk）
          mkdir -p ${{ github.workspace }}/output
          find bin/packages/ -type f \( -iname "*homeproxy*.ipk" -o -iname "*homeproxy*.apk" \) -exec cp {} ${{ github.workspace }}/output/ \;

          echo "=== 检查生成的文件列表 ==="
          ls -la ${{ github.workspace }}/output/

          # 检查是否成功生成包文件
          if [ -z "$(ls -A ${{ github.workspace }}/output/)" ]; then
            echo "错误：output 目录下未找到任何编译出来的安装包！"
            exit 1
          fi

          # 生成 Release 标签
          RELEASE_TAG="v$(date +'%Y.%m.%d-%H%M')"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Upload Artifacts
        if: steps.sync.outputs.has_updates == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: homeproxy-packages
          path: output/*
          retention-days: 7

      - name: Publish to GitHub Releases
        if: steps.sync.outputs.has_updates == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.compile.outputs.release_tag }}
          name: "HomeProxy Packages ${{ steps.compile.outputs.release_tag }}"
          body: |
            ### HomeProxy 自动构建发布
            - **构建时间**：${{ steps.compile.outputs.release_tag }}
            - **包含组件**：主程序包及中文语言包（若已合并进主包则无需单独安装）
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
