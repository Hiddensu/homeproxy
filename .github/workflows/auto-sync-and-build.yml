name: Sync Upstream & Build Package

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with Upstream
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/immortalwrt/homeproxy.git
          git fetch upstream

          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          LOCAL_HASH=$(git rev-parse HEAD)
          UPSTREAM_HASH=$(git rev-parse upstream/$BRANCH)

          echo "Local commit: $LOCAL_HASH"
          echo "Upstream commit: $UPSTREAM_HASH"

          if [ "$LOCAL_HASH" != "$UPSTREAM_HASH" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "合并上游最新代码..."
            git merge upstream/$BRANCH -m "Auto sync from upstream"
            git push origin $BRANCH
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "代码已是最新，跳过构建。"
          fi

      - name: Setup OpenWrt SDK & Compile
        if: steps.sync.outputs.has_updates == 'true'
        id: compile
        run: |
          mkdir -p $HOME/build && cd $HOME/build

          echo "正在获取 OpenWrt SDK..."
          BASE_URL="https://downloads.openwrt.org/snapshots/targets/x86/64/"
          SDK_FILE=$(curl -sL "$BASE_URL" | grep -oE 'openwrt-sdk-x86-64_[^"]+\.tar\.zst' | head -n 1)

          if [ -z "$SDK_FILE" ]; then
            echo "未能获取到有效的 SDK 链接！"
            exit 1
          fi

          echo "下载 SDK: ${BASE_URL}${SDK_FILE}"
          curl -fLO "${BASE_URL}${SDK_FILE}"

          echo "解压 SDK..."
          zstd -d "$SDK_FILE"
          tar -xf *.tar --strip-components=1

          # 挂载源码到 SDK
          cp -r ${{ github.workspace }} package/homeproxy

          # 更新 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 配置 LuCI 简体中文语言
          make defconfig
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-homeproxy=m" >> .config
          make defconfig

          # 编译主包和关联的所有子包（包括语言包）
          echo "开始编译 HomeProxy..."
          make package/homeproxy/compile -j$(nproc) V=s

          # 收集所有相关生成的 .ipk 和 .apk
          mkdir -p ${{ github.workspace }}/output
          find bin/packages/ -type f \( -iname "*homeproxy*.ipk" -o -iname "*homeproxy*.apk" \) -exec cp {} ${{ github.workspace }}/output/ \;

          echo "=== 已收集的打包文件 ==="
          ls -la ${{ github.workspace }}/output/

          # 设置 Release 标签
          RELEASE_TAG="v$(date +'%Y.%m.%d-%H%M')"
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV

      - name: Upload Artifacts
        if: steps.sync.outputs.has_updates == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: homeproxy-packages
          path: output/*
          retention-days: 7

      - name: Publish to GitHub Releases via GitHub CLI
        if: steps.sync.outputs.has_updates == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ${{ github.workspace }}/output
          echo "正在发布 Release: ${{ env.RELEASE_TAG }} ..."
          
          # 使用 GitHub 官方 CLI 创建 Release 并挂载所有生成的包
          gh release create "${{ env.RELEASE_TAG }}" ./* \
            --title "HomeProxy Packages ${{ env.RELEASE_TAG }}" \
            --notes "### HomeProxy 自动编译发布
          - **版本**：${{ env.RELEASE_TAG }}
          - **安装说明**：如包内已自带中文，直接安装主包并在系统切换语言即可。"
